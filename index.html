<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OPA</title>
    <!--
      Document-level reset only. The browser's default 8px body margin pushed
      every screen off the layout grid. Everything else is themed through antd
      tokens (/src/theme) — no stylesheet in src/, by design.
    -->
    <style>
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
      }
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      /*
        Chrome paints its own pale-blue background inside autofilled fields,
        which sits on top of the antd fill and makes those fields look unstyled
        next to the ones the user typed into. The background itself cannot be
        unset, so it is covered: two inset shadows repaint the field with the
        theme's own surface — the container colour underneath, the translucent
        field fill on top, exactly how antd composites it. Every colour comes
        from antd's CSS variables, so the theme stays the single source.

        A password or search field wraps its <input> in an affix wrapper, and
        the shadow only covers the <input> — repainting that alone would leave
        a slab of the wrong colour inside the field. :has() lets the wrapper be
        repainted with it, and the validation states get their own colour so an
        autofilled field that fails validation stays red rather than turning
        neutral in the middle.

        The endless transition is kept as a second line of defence for browsers
        without :has() or inset-shadow support.
      */
      input:-webkit-autofill,
      input:-webkit-autofill:hover,
      input:-webkit-autofill:focus,
      input:-webkit-autofill:active,
      textarea:-webkit-autofill,
      select:-webkit-autofill,
      .ant-input-affix-wrapper:has(input:-webkit-autofill) {
        -webkit-box-shadow:
          inset 0 0 0 1000px var(--ant-color-fill-tertiary),
          inset 0 0 0 1000px var(--ant-color-bg-container);
        box-shadow:
          inset 0 0 0 1000px var(--ant-color-fill-tertiary),
          inset 0 0 0 1000px var(--ant-color-bg-container);
        transition: background-color 100000s ease-in-out 0s;
        -webkit-text-fill-color: inherit;
        caret-color: inherit;
      }
      .ant-form-item-has-error input:-webkit-autofill,
      .ant-form-item-has-error .ant-input-affix-wrapper:has(input:-webkit-autofill) {
        -webkit-box-shadow:
          inset 0 0 0 1000px var(--ant-color-error-bg),
          inset 0 0 0 1000px var(--ant-color-bg-container);
        box-shadow:
          inset 0 0 0 1000px var(--ant-color-error-bg),
          inset 0 0 0 1000px var(--ant-color-bg-container);
      }
      .ant-form-item-has-warning input:-webkit-autofill,
      .ant-form-item-has-warning .ant-input-affix-wrapper:has(input:-webkit-autofill) {
        -webkit-box-shadow:
          inset 0 0 0 1000px var(--ant-color-warning-bg),
          inset 0 0 0 1000px var(--ant-color-bg-container);
        box-shadow:
          inset 0 0 0 1000px var(--ant-color-warning-bg),
          inset 0 0 0 1000px var(--ant-color-bg-container);
      }

      /*
        Text selection.

        The one browser surface no design system ships and every product
        inherits: the OS picks a blue, and on a page whose own blue is
        #2456E6 the two never match. Painted from the theme's primary tint
        instead, through antd's own CSS variable, so it follows a token change
        like everything else. `::selection` needs a real stylesheet rule — a
        style prop cannot reach a pseudo-element.
      */
      ::selection {
        background-color: var(--ant-color-primary-bg);
        color: var(--ant-color-text-heading);
      }

      /* The last row's rule is the card's own edge — a second line under it
         reads as an empty row. antd puts the border on every cell, and a
         :last-child selector is not something a style prop can express. */
      .ant-table-tbody > tr:last-child > td {
        border-bottom: none;
      }

      /* EVERY DIGIT IN A TABLE IS TABULAR. Dates, amounts, reference
         numbers: proportional figures give a "1" less width than a "0", so a
         column of dates or money sits visibly ragged even when the cells are
         perfectly aligned. The figure styles already ask for this at every
         large number; a table has too many cells to reach one at a time, and
         `font-variant-numeric` is inherited, so it is set once here. Text in
         the same cell is unaffected — the property only touches numerals. */
      .ant-table {
        font-variant-numeric: tabular-nums;
      }

      /* A column with no heading — the row-actions one — needs no rule
         separating it from the heading before it. */
      .ant-table-thead > tr > th:has(+ th.opa-th-plain)::before {
        display: none;
      }

      /* A destructive entry is still a menu entry. antd fills it solid red on
         hover with white text, which reads as a button that appeared inside
         the list — the same weight as the Delete confirmation it only leads
         to. A soft tint keeps the warning and drops the shout. Overriding a
         vendor rule, so it needs !important; a style prop cannot reach a
         :hover state. */
      .ant-dropdown-menu-item-danger:not(.ant-dropdown-menu-item-disabled):hover {
        color: var(--ant-color-error) !important;
        background-color: var(--ant-color-error-bg) !important;
      }
</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
